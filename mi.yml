### python2.7 env for the mi-instrument parsers, which read serial numbers out of
### binary raw files (ADCP/VADCP/OPTAA).  Nothing here is run directly -- the
### verification scripts call into this env on their own.
###
###   CONDA_SUBDIR=osx-64 conda env create -f mi.yml
###   conda activate mi-racle
###   pip install -r ~/repos/mi-instrument/requirements.txt
###   pip install -e ~/repos/mi-instrument
###   pip install -e ~/repos/ooi_port_agent
###
### CONDA_SUBDIR=osx-64 is required, python 2.7 is only available for that platform.
### See the README for the fixups needed while installing mi-instrument.

name: mi-racle
channels:
  - defaults
dependencies:
  - python=2.7.18
  - pip
